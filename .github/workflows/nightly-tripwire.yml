# Nightly regression tripwire over the pro pairs whose pro files are committed
# (digitizer/tools/tripwire.py; docs/architecture-review-2026-11-01.md item 4).
#
# Why it is its own workflow, and NEVER a pull_request trigger or a required
# check for main: every digitize is 60-600 s and the population is the 18
# committed pairs, so one pass is about an hour of one runner. A per-PR run
# would add that to every push while measuring a branch no ledger refers to.
# `schedule` fires only on the default branch, so the nightly `check` measures
# main against digitizer/testdata/tripwire_ledger.json and FAILS the job on a
# wrong-way move past tolerance (more cuts, hops or needle-up mm; lower kappa
# or word cc), on a figure the run lost, or on a pro-side figure that moved
# (the reader changed). The table lands in the step summary and an artifact,
# with the DSTs that were measured so the mover can be attributed.
#
# `workflow_dispatch` runs the same check on any branch that carries this
# file, or in `capture` mode measures the SAME tree on FIVE runners and
# builds a fresh ledger from the spread between them: baseline = lower
# median, tolerance = the spread rounded up to the figure's resolution. That
# is the only honest source of a tolerance here (run-to-run noise on the
# runner class the nightly draws), and it is how the ledger is re-seeded
# after a PR moves a figure on purpose: dispatch capture, download
# `tripwire-ledger-<run id>`, commit it. Linux numbers only: the three
# deselected golden tests and art-fidelity-baseline's comment both say a
# Windows figure is not comparable to one measured here.
#
# The push-to-main report jobs in python-package-conda.yml
# (art-fidelity-baseline, bench-digitize) are untouched.
name: Nightly tripwire

on:
  schedule:
    - cron: '23 6 * * *'     # 06:23 UTC, after the evening's merges in Kent's time zone
  workflow_dispatch:
    inputs:
      mode:
        description: 'check the ledger (the nightly), or capture a new ledger from five passes'
        type: choice
        options: [check, capture]
        default: check

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 18 digitizes at 60-600 s each, plus the word reading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      # Tesseract from apt: the word cc rows read through OCR, and what the
      # tesserocr wheel takes from this package is its model, eng.traineddata
      # (digitizer_core/ocr.py `tessdata_dir`). Without it those rows go missing.
      #
      # Installed from CACHED .deb files, the way studio-e2e does it
      # (python-package-conda.yml), because the mirror is the one part of this
      # job that fails for reasons no ledger row describes: run 43039609421
      # (2026-11-11) spent 3m20s on "Temporary failure resolving
      # 'azure.archive.ubuntu.com'", exited 100 and read nothing. A cache hit
      # runs `dpkg -i` and never asks the mirror. The key pins the runner image
      # build, since a .deb set is only valid against the image it was resolved
      # on; no restore-keys for the same reason. On a miss (a new image, or a
      # cache evicted after a week unused) apt runs, up to four times, 30/60/90 s
      # apart, and whatever it downloaded is what gets cached. The last two
      # lines are the check for either branch. The same three steps are in the
      # `measure` job below: change both.
      - name: Runner image id (apt cache key)
        id: image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages (Tesseract OCR)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tripwire-apt-debs
          key: tripwire-apt-${{ steps.image.outputs.id }}-tesseract-ocr
      - name: Install system dependencies (Tesseract OCR)
        id: apt
        run: |
          DEBS="$HOME/.cache/tripwire-apt-debs"
          if ls "$DEBS"/*.deb >/dev/null 2>&1 && sudo dpkg -i "$DEBS"/*.deb; then
            echo "installed from the cached .deb files; the mirror was not asked"
          else
            sudo apt-get clean
            for try in 1 2 3 4; do
              sudo apt-get update || true     # a half-failed update still exits 0; install is the test
              if sudo apt-get install -y tesseract-ocr; then break; fi
              if [ "$try" = 4 ]; then echo "apt could not install tesseract-ocr in 4 tries (mirror or DNS)"; exit 1; fi
              echo "apt try $try failed; waiting $((try * 30)) s"
              sleep $((try * 30))
            done
            mkdir -p "$DEBS"
            sudo cp /var/cache/apt/archives/*.deb "$DEBS"/ || echo "no .deb to cache (already on the image)"
          fi
          tesseract --version
          ls /usr/share/tesseract-ocr/*/tessdata/eng.traineddata
      - name: Install
        id: pip
        working-directory: digitizer
        run: pip install -r requirements.txt
      # No pipe: `| tee` would hand this step tee's exit code instead of the
      # tool's (the pytest | tail trap, CLAUDE.md). The tool's exit code IS
      # the verdict: 1 on a wrong-way move, and that fails this job. A red
      # check names its rows on one line (`red_line`), which the tool also
      # prints as this job's error annotation: the reason shows on the run page
      # and in `check-runs/<job id>/annotations` without opening a log.
      - name: Check every committed pair against the ledger
        id: check
        working-directory: digitizer
        run: >
          python -m tools.tripwire check
          --ledger testdata/tripwire_ledger.json
          --runs tripwire-runs --figures tripwire-runs/figures.json
          --table tripwire-check.md --json tripwire-check.json
      # Two kinds of red, told apart here: a table means the pairs were read
      # (its "RED, n row(s): ..." line names the rows that failed); no table
      # means a step before the reading failed, and the summary says which.
      - name: Publish the table to the run summary
        if: always()
        working-directory: digitizer
        env:
          APT: ${{ steps.apt.outcome }}
          PIP: ${{ steps.pip.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          {
            echo '## Nightly tripwire'
            echo
            echo 'Linux, `ubuntu-latest`, against `digitizer/testdata/tripwire_ledger.json`. Kappa is chance-corrected; the chance floor rides in brackets.'
            echo
            if [ -f tripwire-check.md ]; then
              cat tripwire-check.md
            else
              echo "**No reading.** No pair was compared with the ledger, so this red says nothing about the engine. Step outcomes: system packages (apt) \`$APT\`, pip install \`$PIP\`, check \`$CHECK\`. The first one that is not \`success\` is the reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f tripwire-check.md ]; then
            echo "::error title=Nightly tripwire::No reading: the job stopped before a table was written (system packages: $APT, pip install: $PIP, check: $CHECK). This red is not a ledger verdict."
          fi
      - name: Upload the table, the pass and the measured DSTs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripwire-check-${{ github.run_id }}
          path: |
            digitizer/tripwire-check.md
            digitizer/tripwire-check.json
            digitizer/tripwire-runs/figures.json
            digitizer/tripwire-runs/*/ours.dst
          if-no-files-found: warn

  # CAPTURE, dispatch only: five passes of the same tree, one per runner (was three until 2026-11-14: three passes that agreed read 8 jittery rows as a false zero, so the capture needs 5, tripwire.MIN_PASSES_FOR_ZERO).
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'capture'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      # The same cached Tesseract install as the `check` job (explained there).
      - name: Runner image id (apt cache key)
        id: image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages (Tesseract OCR)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tripwire-apt-debs
          key: tripwire-apt-${{ steps.image.outputs.id }}-tesseract-ocr
      - name: Install system dependencies (Tesseract OCR)
        id: apt
        run: |
          DEBS="$HOME/.cache/tripwire-apt-debs"
          if ls "$DEBS"/*.deb >/dev/null 2>&1 && sudo dpkg -i "$DEBS"/*.deb; then
            echo "installed from the cached .deb files; the mirror was not asked"
          else
            sudo apt-get clean
            for try in 1 2 3 4; do
              sudo apt-get update || true     # a half-failed update still exits 0; install is the test
              if sudo apt-get install -y tesseract-ocr; then break; fi
              if [ "$try" = 4 ]; then echo "apt could not install tesseract-ocr in 4 tries (mirror or DNS)"; exit 1; fi
              echo "apt try $try failed; waiting $((try * 30)) s"
              sleep $((try * 30))
            done
            mkdir -p "$DEBS"
            sudo cp /var/cache/apt/archives/*.deb "$DEBS"/ || echo "no .deb to cache (already on the image)"
          fi
          tesseract --version
          ls /usr/share/tesseract-ocr/*/tessdata/eng.traineddata
      - name: Install
        working-directory: digitizer
        run: pip install -r requirements.txt
      - name: Runner size (the spread is between runners of this class)
        continue-on-error: true
        run: |
          echo "nproc: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
      - name: Measure every committed pair (pass ${{ matrix.pass }})
        working-directory: digitizer
        run: python -m tools.tripwire measure --runs tripwire-runs --figures tripwire-pass-${{ matrix.pass }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tripwire-pass-${{ matrix.pass }}-${{ github.run_id }}
          path: |
            digitizer/tripwire-pass-${{ matrix.pass }}.json
            digitizer/tripwire-runs/*/ours.dst
          if-no-files-found: error

  capture:
    needs: measure
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'capture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Building the ledger from the passes needs only the standard library.
      - uses: actions/download-artifact@v4
        with:
          pattern: tripwire-pass-*-${{ github.run_id }}
          path: passes
          merge-multiple: true
      - name: Build the ledger from the five passes
        working-directory: digitizer
        run: >
          python -m tools.tripwire capture
          --from ../passes/tripwire-pass-1.json ../passes/tripwire-pass-2.json ../passes/tripwire-pass-3.json ../passes/tripwire-pass-4.json ../passes/tripwire-pass-5.json
          --ledger tripwire-ledger.json
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          > tripwire-ledger.md
      - name: Publish the ledger table to the run summary
        if: always()
        working-directory: digitizer
        run: |
          {
            echo '## Tripwire ledger (capture)'
            echo
            echo 'Commit `tripwire-ledger.json` from this run'"'"'s artifact as `digitizer/testdata/tripwire_ledger.json`.'
            echo
            cat tripwire-ledger.md || echo '(no ledger: a pass did not finish)'
          } >> "$GITHUB_STEP_SUMMARY"
      # The artifact below is how the ledger is taken, but an artifact downloads
      # from a blob-storage host that a cloud session's network policy can
      # refuse (2026-11-12), while a job log always reads through the API
      # (`gh api repos/<owner>/<repo>/actions/jobs/<id>/logs`). So the same
      # bytes are printed between two marker lines, with their sha256: strip
      # each line's timestamp and one space, and check the hash.
      - name: Print the ledger to the log (the same bytes as the artifact)
        working-directory: digitizer
        run: |
          echo "tripwire-ledger.json sha256 $(sha256sum < tripwire-ledger.json | cut -d' ' -f1)"
          echo '-----BEGIN TRIPWIRE LEDGER-----'
          cat tripwire-ledger.json
          echo '-----END TRIPWIRE LEDGER-----'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tripwire-ledger-${{ github.run_id }}
          path: |
            digitizer/tripwire-ledger.json
            digitizer/tripwire-ledger.md
          if-no-files-found: error
