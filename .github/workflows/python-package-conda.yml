# CI for EMB-Bot's three test suites. This file started as GitHub's stock
# "Python Package using Conda" starter template (added 2026-08-04); the repo
# has no conda environment — the digitizer is a plain pip venv (see
# COOKBOOK.md "Running things") and half the codebase is JavaScript — so the
# template's steps were replaced the same day with jobs that run the suites
# the repo actually has, keeping the template's intent (lint + test on every
# push).
name: CI

on: [push, pull_request]

jobs:
  engine:
    # The browser JS stitch engine's Node test harness (root, no npm deps).
    #
    # The PES/EXP/DST cross-validation tests need a python that can import
    # pystitch, so this job installs one. The old comment here claimed they
    # "run for real in the digitizer job's environment, not here" — they do
    # not: that job runs `python -m pytest`, never `node --test`, so this is
    # the only job that invokes them at all. Combined with their probing a
    # module the 2026-08-11 pystitch swap had removed, the result was
    # pass 0 / skipped 6 — the repo's ONLY automated third-party format check
    # asserting nothing, in CI, while a real PES defect sat behind it.
    # The tests now throw rather than skip when CI is set, so this install
    # step going missing fails the build instead of going quiet again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pystitch (the cross-validation reference decoder)
        # Pinned to the same version digitizer/requirements.txt pins, so the
        # reference reader in CI is the one the digitizer actually ships.
        run: pip install pystitch==1.0.1
      - name: Engine tests
        run: node --test

  studio:
    # The Svelte Studio app's vitest suite (logic + component specs). The
    # Playwright e2e specs are excluded from vitest by app/vite.config.js —
    # they need a real browser + the live digitizer service and run in the
    # studio-e2e job below (see e2e/*.spec.js's own service-bootstrap notes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Studio tests
        working-directory: app
        run: npx vitest run

  digitizer:
    # The Python pipeline suite. Deps are pinned in digitizer/requirements.txt
    # (frozen from the working venv — the k-means/golden tests are pinned to
    # exact library behavior, so exact versions matter). `python -m pytest`
    # from digitizer/ puts the package on sys.path; no editable install
    # needed (COOKBOOK.md).
    #
    # THREE byte-identical/golden-hash tests are deselected, listed at the
    # run step below. It was five until 2026-08-22; the two logo_alpha.png
    # parametrizations were removed after the remove-and-see check finally
    # ran. Keep this the ONE place that explains why -- the run step used to
    # carry a second copy of this reasoning and the two drifted apart within
    # the day.
    #
    # WHY THEY FAIL. Not version skew: every geometry-relevant pin matches
    # requirements.txt exactly. It is per-fixture platform-level numerics --
    # one such failure traces to a single contour on one region of 31. The
    # matrix lives in MASTER_SCOPE "Gotchas", the failure classes in
    # COOKBOOK.md "Running things", the evidence in
    # .claude/memory/windows-goldens-fail-locally.md.
    #
    # WHY NOT JUST RE-CAPTURE. tools/recapture_flat_lane_key.py's own
    # --pre-change-tree machine check REFUSES on a fresh ubuntu-latest Actions
    # runner, not just in a dev container, differing from the 2026-08-17-pinned
    # golden even on the UNMODIFIED pre-change engine (runs 32396593318,
    # 32399279461). The reference platform drifted from itself in three days,
    # independent of any code change here. Deselected rather than
    # force-written, on Kent's call -- re-capture needs an ubuntu-latest
    # window that realigns with the pin, same as the three-day wait before
    # PR #159's capture landed.
    #
    # THE REMOVE-AND-SEE CHECK IS DONE -- it was standing and unowned for
    # months. Run 2026-08-22 on Linux with this job's exact Python (3.12) and
    # requirements.txt pinned exactly, and again on 3.13 for the same split,
    # so it is not version skew:
    #   FAIL  test_pushcomp[logo_whitebg.png-towel]
    #   FAIL  test_flat_lane_byte_identical[photo/enthusiast_logo.png]
    #   FAIL  test_stage2_photo_segment[photo/enthusiast_logo.png]
    #   PASS  test_flat_lane_byte_identical[logo_alpha.png]
    #   PASS  test_stage2_photo_segment[logo_alpha.png]
    # The two PASSes were costing real coverage on a fixture that agrees, so
    # they were removed -- and this is no longer a container measurement being
    # extrapolated: the push that removed them (db0e642) went GREEN on the real
    # ubuntu-latest runner, which is the runner-side confirmation the earlier
    # version of this comment asked for and declined to act without.
    #
    # Deselecting exactly these three keeps CI green AND meaningful: any NEW
    # golden break still fails the job. The standing rule survives -- if any of
    # these three ever passes here, remove its deselect and find out why.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      # Tesseract OCR for textcluster.py's OCR-confidence quality gate --
      # see digitizer/README.md "Setup".
      # Tesseract OCR for textcluster.py's OCR-suggested-text pass (Studio
      # "Convert to text") -- see digitizer/README.md "Setup".
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        working-directory: digitizer
        run: pip install -r requirements.txt
      - name: Lint (syntax errors / undefined names only, per the original template)
        working-directory: digitizer
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      # `-n auto` (pytest-xdist): ~1,100 tests of real OpenCV/shapely work ran
      # ~19 minutes serially here, on every push, which is long enough that a
      # red digitizer job stops being noticed promptly. Verified parallel-safe
      # by running the whole suite both ways and comparing the pass/fail set —
      # identical, including the deselects below. Nothing in the suite
      # writes to a shared path (fixtures are read-only, every test that writes
      # uses tmp_path), so worker isolation is real rather than assumed.
      # The three --deselect lines below are explained ONCE, in this job's
      # header comment: what they are, why they fail, why they are not
      # re-captured, and the measurement that cut the list from five to three.
      # Do not restate any of that here — that duplication is what let the
      # header go on claiming "five" after the list became three.
      - name: Digitizer tests
        working-directory: digitizer
        run: >
          python -m pytest tests/ -q -n auto
          --deselect "tests/test_pushcomp.py::test_flag_off_is_byte_identical_to_the_shipped_engine[logo_whitebg.png-towel]"
          --deselect "tests/test_flat_lane_byte_identical.py::test_flat_lane_is_byte_identical_to_the_pre_change_golden[photo/enthusiast_logo.png]"
          --deselect "tests/test_stage2_photo_segment.py::test_flat_and_gradient_lanes_still_match_golden_after_photo_dispatch[photo/enthusiast_logo.png]"

  studio-e2e:
    # The real-browser Playwright suite (app/e2e). COOKBOOK's hard-won lesson:
    # this suite is excluded from vitest and went dark for three days when
    # nothing ran it automatically — this job exists so that cannot recur.
    #
    # The specs are self-contained but need two servers: Playwright's own
    # webServer config starts Vite on :5183, and the digitize-* specs spawn the
    # digitizer service themselves from digitizer/.venv (see the bootstrap in
    # e2e/*.spec.js). They SKIP quietly when that venv is missing — a skip here
    # would be the dark-suite failure mode all over again — so this job builds
    # the venv at the exact path the bootstrap probes first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      # Tesseract so the service's OCR-suggested-text pass behaves as it does
      # in the digitizer job (text-cluster-convert.spec.js drives that UI).
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Build the digitizer venv the e2e bootstrap looks for
        working-directory: digitizer
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e '.[service]'
      - name: Install
        working-directory: app
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      # --workers=1: the five service-gated specs share one service on :8721
      # and each file's afterAll kills it when that file finishes — under
      # parallel workers one file's teardown races another file's mid-test
      # requests (observed locally: red at 4 workers, green solo). Serial is
      # bounded by the specs' own timeouts and removes the race entirely.
      - name: Playwright e2e
        working-directory: app
        run: npx playwright test --workers=1 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      # The digitize-* specs SKIP (not fail) when the service bootstrap can't
      # produce a healthy service — venv missing, spawn failure, dead /health.
      # A skip here is the dark-suite failure mode wearing a green checkmark,
      # so treat any skip as a failure. Legitimate skips are zero: wizard-smoke
      # and manual-trace-import never skip, and this job builds the venv above.
      - name: Fail if any spec skipped
        working-directory: app
        run: |
          node -e "const s=require('./results.json').stats; console.log(JSON.stringify(s)); if(s.skipped>0){console.error(s.skipped+' spec(s) skipped — the service bootstrap failed; read the skip reasons in the list output above'); process.exit(1)}"
