# CI for EMB-Bot's three test suites. This file started as GitHub's stock
# "Python Package using Conda" starter template (added 2026-08-04); the repo
# has no conda environment — the digitizer is a plain pip venv (see
# COOKBOOK.md "Running things") and half the codebase is JavaScript — so the
# template's steps were replaced the same day with jobs that run the suites
# the repo actually has, keeping the template's intent (lint + test on every
# push).
name: CI

# ONE run per commit, not two.
#
# This was `on: [push, pull_request]`, which fires BOTH events for any branch
# that has a PR open — so every PR head got two full runs and every check name
# (`engine`, `studio`, `studio-e2e`, `digitizer`) appeared twice on the same
# SHA. Measured 2026-08-26: 7 of the 12 most recent heads ran twice, and
# `digitizer` alone is 12–15 minutes, so each PR push burned ~13 minutes of
# runner time reproducing a result it already had.
#
# The duplication was not just wasteful, it was load-bearing on a bug. On
# 2026-08-26 the pull_request run for f95db7a hit `startup_failure`, was
# re-queued by GitHub, then sat `queued` with ZERO jobs — neither re-runnable
# nor cancellable (409 "Cannot cancel a workflow re-run that has not yet
# queued"). Its four orphaned check runs pinned PR #272 at
# mergeable_state=unstable for ~25 minutes while the push run had already
# passed everything. It cleared on its own that time. Once these checks are
# REQUIRED for merge, the same phantom is a hard block instead of a cosmetic
# one — which is why this is fixed before branch protection goes on, not after.
#
# `push` is now main-only, so:
#   - a PR branch is covered exactly once, by the pull_request event
#   - main is still covered on every merge
#   - a branch pushed with no PR open gets no run until the PR exists, which
#     is fine here: a PR is how everything reaches main.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same PR rather than racing them. Never
# cancels on main — a merge's run is the record that main is green.
#
# A main push gets a group of its OWN (keyed on run_id), not a shared one.
# `cancel-in-progress: false` was not enough: GitHub keeps at most ONE pending
# run per concurrency group and cancels the older pending one whenever a newer
# one arrives, whatever cancel-in-progress says. With merges minutes apart,
# every main run but the one holding the group was cancelled while pending --
# measured 2026-10-08: 12 consecutive main push runs from 06:26 to 09:21 UTC
# ended `cancelled` (one more sat queued holding the group), so main had no
# completed run after 06:15. Cost: every
# merge now runs the full suite on main, which is what this comment always
# said it did.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    # The browser JS stitch engine's Node test harness (root, no npm deps).
    #
    # The PES/EXP/DST cross-validation tests need a python that can import
    # pystitch, so this job installs one. The old comment here claimed they
    # "run for real in the digitizer job's environment, not here" — they do
    # not: that job runs `python -m pytest`, never `node --test`, so this is
    # the only job that invokes them at all. Combined with their probing a
    # module the 2026-08-11 pystitch swap had removed, the result was
    # pass 0 / skipped 6 — the repo's ONLY automated third-party format check
    # asserting nothing, in CI, while a real PES defect sat behind it.
    # The tests now throw rather than skip when CI is set, so this install
    # step going missing fails the build instead of going quiet again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pystitch (the cross-validation reference decoder)
        # Pinned to the same version digitizer/requirements.txt pins, so the
        # reference reader in CI is the one the digitizer actually ships.
        run: pip install pystitch==1.0.1
      - name: Engine tests
        run: node --test

  studio:
    # The Svelte Studio app's vitest suite (logic + component specs). The
    # Playwright e2e specs are excluded from vitest by app/vite.config.js —
    # they need a real browser + the live digitizer service and run in the
    # studio-e2e job below (see e2e/*.spec.js's own service-bootstrap notes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Studio tests
        working-directory: app
        run: npx vitest run

  digitizer-shard:
    # The Python pipeline suite, split across SHARDS parallel runners. The
    # required check is the `digitizer` job further down, which needs every
    # shard -- see its comment for what it proves.
    #
    # WHY SHARDS. Measured 2026-10-08 over three green main runs: the job took
    # 72-78 minutes and 71.5-77.5 of that was the test step -- checkout,
    # Tesseract, pip and lint together are about one minute, so caching had
    # nothing left to win. The runner is 4 cores and `-n auto` already uses all
    # four. The only lever left was more runners. Each shard keeps `-n auto`
    # on its own four cores; tests/_ci_shard.py assigns whole FILES to shards
    # (module-scoped fixtures stay computed once) balanced on
    # tests/.shard_durations.json (per-file seconds from this job's own JUnit
    # artifacts; refresh with tools/ci_shard_durations.py when one shard
    # starts running visibly long -- staleness costs balance, never coverage).
    # Changing SHARDS means changing the matrix list and the `DIGITIZER_SHARD`
    # denominator together.
    #
    # The Python pipeline suite. Deps are pinned in digitizer/requirements.txt
    # (frozen from the working venv — the k-means/golden tests are pinned to
    # exact library behavior, so exact versions matter). `python -m pytest`
    # from digitizer/ puts the package on sys.path; no editable install
    # needed (COOKBOOK.md).
    #
    # THREE byte-identical/golden-hash tests are deselected, listed at the
    # run step below. It was five until 2026-08-22; the two logo_alpha.png
    # parametrizations were removed after the remove-and-see check finally
    # ran. Keep this the ONE place that explains why -- the run step used to
    # carry a second copy of this reasoning and the two drifted apart within
    # the day.
    #
    # WHY THEY FAIL. Not version skew: every geometry-relevant pin matches
    # requirements.txt exactly. It is per-fixture platform-level numerics --
    # one such failure traces to a single contour on one region of 31. The
    # matrix lives in MASTER_SCOPE "Gotchas", the failure classes in
    # COOKBOOK.md "Running things", the evidence in
    # .claude/memory/windows-goldens-fail-locally.md.
    #
    # WHY NOT JUST RE-CAPTURE. tools/recapture_flat_lane_key.py's own
    # --pre-change-tree machine check REFUSES on a fresh ubuntu-latest Actions
    # runner, not just in a dev container, differing from the 2026-08-17-pinned
    # golden even on the UNMODIFIED pre-change engine (runs 32396593318,
    # 32399279461). The reference platform drifted from itself in three days,
    # independent of any code change here. Deselected rather than
    # force-written, on Kent's call -- re-capture needs an ubuntu-latest
    # window that realigns with the pin, same as the three-day wait before
    # PR #159's capture landed.
    #
    # THE REMOVE-AND-SEE CHECK IS DONE -- it was standing and unowned for
    # months. Run 2026-08-22 on Linux with this job's exact Python (3.12) and
    # requirements.txt pinned exactly, and again on 3.13 for the same split,
    # so it is not version skew:
    #   FAIL  test_pushcomp[logo_whitebg.png-towel]
    #   FAIL  test_flat_lane_byte_identical[photo/enthusiast_logo.png]
    #   FAIL  test_stage2_photo_segment[photo/enthusiast_logo.png]
    #   PASS  test_flat_lane_byte_identical[logo_alpha.png]
    #   PASS  test_stage2_photo_segment[logo_alpha.png]
    # The two PASSes were costing real coverage on a fixture that agrees, so
    # they were removed -- and this is no longer a container measurement being
    # extrapolated: the push that removed them (db0e642) went GREEN on the real
    # ubuntu-latest runner, which is the runner-side confirmation the earlier
    # version of this comment asked for and declined to act without.
    #
    # Deselecting exactly these three keeps CI green AND meaningful: any NEW
    # golden break still fails the job. The standing rule survives -- if any of
    # these three ever passes here, remove its deselect and find out why.
    #
    # 2026-10-08: TWO now. The towel row was re-pinned and its deselect
    # removed -- its mismatch was a stale pin, not numerics (three machines,
    # AVX-512 and forced-AVX2 dispatch alike, compute the re-pinned tuple;
    # see GOLDEN_FLAG_OFF in tests/test_pushcomp.py). The two enthusiast_logo
    # rows stay: that key is ALSO engine-stale (30 of 31 areas moved under
    # the subpixel_edges flip), so no tolerance revives it without a capture
    # on this runner.
    name: digitizer shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end even when one goes red, so a failing PR
      # shows ALL its failures at once rather than one shard's worth.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      # Tesseract OCR for textcluster.py's OCR-confidence quality gate --
      # see digitizer/README.md "Setup".
      # Tesseract OCR for textcluster.py's OCR-suggested-text pass (Studio
      # "Convert to text") -- see digitizer/README.md "Setup".
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        working-directory: digitizer
        run: pip install -r requirements.txt
      # Once, not six times: shard 1 carries it.
      - name: Lint (syntax errors / undefined names only, per the original template)
        if: matrix.shard == 1
        working-directory: digitizer
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      # `-n auto` (pytest-xdist): ~1,100 tests of real OpenCV/shapely work ran
      # ~19 minutes serially here, on every push, which is long enough that a
      # red digitizer job stops being noticed promptly. (That count is the one
      # at the time; the suite passed 1,979 on 2026-09-06 and the job now runs
      # 10-42 minutes -- see CLAUDE.md item 7 for the measured distribution and
      # the step below for why the runner is worth recording.) Verified parallel-safe
      # by running the whole suite both ways and comparing the pass/fail set —
      # identical, including the deselects below. Nothing in the suite
      # writes to a shared path (fixtures are read-only, every test that writes
      # uses tmp_path), so worker isolation is real rather than assumed.
      # `--dist loadgroup --no-loadscope-reorder`: tests that share a module
      # fixture or a memoized pipeline run go to ONE worker, everything else
      # spreads test by test, heaviest first. tests/_xdist_groups.py has the
      # rules and the measurement (shard 1/6: 389 s -> 248 s with the thread
      # setting below). Same tests, same count -- only placement changes.
      # The three --deselect lines below are explained ONCE, in this job's
      # header comment: what they are, why they fail, why they are not
      # re-captured, and the measurement that cut the list from five to three.
      # Do not restate any of that here — that duplication is what let the
      # header go on claiming "five" after the list became three.
      # The runner's own size, because `-n auto` follows it and this job's
      # duration follows that. Measured 2026-09-06 over 220 jobs: the SAME test
      # count lands anywhere from 19.6 to 34.5 minutes (1,851 tests) and 17.9
      # to 33.7 (1,968) -- a 1.9x spread on identical work. It is all in this
      # step, not in setup (Install is 0.27 min on fast and slow runs alike),
      # and it is NOT concurrency: the 41.8-minute worst case ran with zero
      # other digitizer jobs in flight, and the most-contended jobs are the
      # fastest. What is left is the runner, and nothing in the log records
      # which one we drew. Three lines, seconds to run, and the next person
      # gets to answer it from the log instead of an API sweep.
      - name: Runner size (for the timing note in CLAUDE.md item 7)
        # A diagnostic must never be able to fail the build. `python` is on
        # PATH here (setup-python ran, and `Digitizer tests` below invokes it
        # the same way), but a required check going red over an echo would be
        # the worst possible trade for three lines of information.
        continue-on-error: true
        run: |
          echo "nproc: $(nproc)"
          python -c "import os; print('os.cpu_count:', os.cpu_count())"
          cat /proc/meminfo | head -1
      - name: Digitizer tests
        working-directory: digitizer
        env:
          DIGITIZER_SHARD: ${{ matrix.shard }}/6
          DIGITIZER_SHARD_MANIFEST: shard-manifest.json
          # One native thread per xdist worker. `-n auto` already puts a
          # worker on each of the runner's four cores; left alone, OpenCV and
          # OpenBLAS each start four threads PER WORKER and the sixteen fight
          # over four cores. Measured 2026-10-08 on shard 1/6, same tree,
          # 4-core box: 389 s -> 357 s from this alone. Any pinned result that
          # depended on the thread count would fail here, not pass quietly;
          # the fixture-sweep tools (tools/thread_match_floor.py) have always
          # run single-threaded.
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENCV_FOR_THREADS_NUM: '1'
        run: >
          python -m pytest tests/ -q -n auto
          --dist loadgroup --no-loadscope-reorder
          --junitxml=junit.xml
          --deselect "tests/test_flat_lane_byte_identical.py::test_flat_lane_is_byte_identical_to_the_pre_change_golden[photo/enthusiast_logo.png]"
          --deselect "tests/test_stage2_photo_segment.py::test_flat_and_gradient_lanes_still_match_golden_after_photo_dispatch[photo/enthusiast_logo.png]"
      # The manifest is what the `digitizer` job checks coverage against; the
      # JUnit XML is what tools/ci_shard_durations.py rebalances from.
      - name: Upload shard manifest and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitizer-shard-${{ matrix.shard }}
          # Re-running one failed shard re-uploads under the same name; without
          # this, v4 refuses the duplicate and the re-run goes red on upload.
          overwrite: true
          path: |
            digitizer/shard-manifest.json
            digitizer/junit.xml
          if-no-files-found: warn

  digitizer:
    # THE REQUIRED CHECK. Branch protection requires a check named exactly
    # `digitizer`; since 2026-10-08 this is that check, and it still means
    # "every test ran and passed":
    #   1. `if: always()` -- it runs even when a shard failed, was cancelled
    #      or was skipped. NOT `!cancelled()`: a job skipped by its `if:`
    #      reports a required check as PASSING, so a head run cancelled once
    #      engine/studio/studio-e2e were green would let auto-merge fire with
    #      the digitizer tests unfinished.
    #   2. A CANCELLED shard set (a superseded run under cancel-in-progress, or
    #      a manual cancel) force-cancels this run, so `digitizer` ends
    #      `cancelled` -- which blocks merge exactly as the single job's
    #      cancellation did -- instead of a fake red. Before this, every
    #      superseded push left a red `digitizer` behind (runs 37720996814 and
    #      37720277164, PRs #678/#682). If the force-cancel cannot land (a fork
    #      PR's read-only token), the step still fails: closed, never green.
    #   3. Otherwise it fails unless EVERY shard's result is `success`.
    #   4. tools/ci_shard_check.py fails unless the shards' manifests prove
    #      one shard each for 1..6, identical collected lists, and selections
    #      that are disjoint and add up to exactly that collected list.
    # Stdlib python only, no install: seconds after the last shard.
    needs: digitizer-shard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write   # force-cancel of this run, step below
      contents: read
    steps:
      - name: A cancelled run ends cancelled, not red
        if: needs.digitizer-shard.result == 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/force-cancel"
          sleep 120
          echo "force-cancel did not stop this job; failing closed"
          exit 1
      - name: Every shard succeeded
        run: |
          echo "digitizer-shard result: ${{ needs.digitizer-shard.result }}"
          test "${{ needs.digitizer-shard.result }}" = success
      - uses: actions/checkout@v4
        with:
          sparse-checkout: digitizer/tools/ci_shard_check.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: digitizer-shard-*
          path: shards
      - name: The shards together ran the whole suite, once
        run: python3 digitizer/tools/ci_shard_check.py shards

  studio-e2e:
    # The real-browser Playwright suite (app/e2e). COOKBOOK's hard-won lesson:
    # this suite is excluded from vitest and went dark for three days when
    # nothing ran it automatically — this job exists so that cannot recur.
    #
    # The specs are self-contained but need two servers: Playwright's own
    # webServer config starts Vite on :5183, and the digitize-* specs spawn the
    # digitizer service themselves from digitizer/.venv (see the bootstrap in
    # e2e/*.spec.js). They SKIP quietly when that venv is missing — a skip here
    # would be the dark-suite failure mode all over again — so this job builds
    # the venv at the exact path the bootstrap probes first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      # Tesseract so the service's OCR-suggested-text pass behaves as it does
      # in the digitizer job (text-cluster-convert.spec.js drives that UI).
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      # Cache the venv itself (not just pip's wheel cache): the install step
      # below then only verifies. Same path as before, so the bootstrap probe
      # and the editable install resolve identically.
      - name: Cache the digitizer venv
        uses: actions/cache@v4
        with:
          path: digitizer/.venv
          key: e2e-venv-${{ runner.os }}-py312-${{ hashFiles('digitizer/requirements.txt', 'digitizer/pyproject.toml') }}
      - name: Build the digitizer venv the e2e bootstrap looks for
        working-directory: digitizer
        run: |
          [ -x .venv/bin/python ] || python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e '.[service]'
      - name: Install
        working-directory: app
        run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system libraries (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium
      # The specs that talk to the shared digitizer service on :8721 (every
      # file naming SERVICE_URL) stay serial: each file's afterAll kills that
      # one service, so under parallel workers one file's teardown races
      # another file's mid-test requests (observed locally: red at 4 workers,
      # green solo). Every OTHER spec is service-free and runs on 4 workers.
      # Together the two steps run every spec file exactly once.
      - name: Playwright e2e (service-free specs, parallel)
        working-directory: app
        run: |
          FILES=$(grep -L SERVICE_URL e2e/*.spec.js | tr '\n' ' ')
          npx playwright test --workers=4 --reporter=list,json $FILES
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results-parallel.json
      - name: Playwright e2e (digitizer-service specs, serial)
        working-directory: app
        run: |
          FILES=$(grep -l SERVICE_URL e2e/*.spec.js | tr '\n' ' ')
          npx playwright test --workers=1 --reporter=list,json $FILES
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      # The digitize-* specs SKIP (not fail) when the service bootstrap can't
      # produce a healthy service — venv missing, spawn failure, dead /health.
      # A skip here is the dark-suite failure mode wearing a green checkmark,
      # so treat any skip as a failure. Legitimate skips are zero: wizard-smoke
      # and manual-trace-import never skip, and this job builds the venv above.
      - name: Fail if any spec skipped
        working-directory: app
        run: |
          node -e "let t=0,k=0; for(const f of ['./results-parallel.json','./results.json']){const s=require(f).stats; console.log(f,JSON.stringify(s)); t+=s.expected+s.unexpected+s.flaky; k+=s.skipped} if(k>0){const s={skipped:k};console.error(s.skipped+' spec(s) skipped — the service bootstrap failed; read the skip reasons in the list output above'); process.exit(1)}"

  art-fidelity-baseline:
    # REPORT-ONLY. Runs tools/artfidelity_self.py over the tracked fixture set
    # and publishes the table; it never fails the build and gates nothing.
    #
    # Why it exists: that instrument answers "does our stitch-out look like the
    # artwork" with no professional reference, which is the question ROADMAP
    # phase 1's exit condition is phrased in terms of. Its numbers are
    # platform-sensitive the same way the three deselected golden tests are, so
    # a number measured on Kent's Windows box is not comparable to one measured
    # anywhere else. This job's whole job is to capture the LINUX baseline, on
    # main, so later runs have something legitimate to be compared against.
    #
    # main-only and push-only, deliberately. A baseline is a main-branch fact,
    # and the run digitizes fourteen designs — several of them photo/gradient
    # routes that take minutes apiece — so putting it on every PR would add
    # that cost to every push while measuring a branch no baseline refers to.
    #
    # `continue-on-error` is belt-and-braces on top of the tool's own exit
    # code: this must never be the reason a green main goes red. If it starts
    # failing, that is a bug in the instrument to fix on a branch, not a
    # signal about the engine.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      # Same Tesseract install as the digitizer job: the fixture set includes
      # designs whose route runs textcluster's OCR pass, and a silently
      # OCR-less run would measure a different pipeline than the suite does.
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        working-directory: digitizer
        run: pip install -r requirements.txt
      # No pipe. `... | tee file` would hand this step TEE's exit code instead
      # of the tool's — the same trap COOKBOOK.md records for `pytest | tail`,
      # and a report-only job is exactly where a silently-swallowed failure
      # would go unnoticed longest. The tool writes its table to stdout and its
      # per-fixture progress to stderr, so redirecting stdout alone captures
      # the table while progress still streams live into the run log.
      - name: Score the tracked fixture set
        working-directory: digitizer
        run: python -m tools.artfidelity_self --all --csv artfid-baseline.csv > artfid-baseline.txt
      # The table in the log scrolls away with the run; the summary is what
      # someone actually reads when asking "what did this measure".
      - name: Publish the table to the run summary
        if: always()
        working-directory: digitizer
        run: |
          {
            echo '## Art-fidelity baseline (report-only)'
            echo
            echo 'Linux, `ubuntu-latest`. Not comparable to a Windows run.'
            echo
            echo '```'
            cat artfid-baseline.txt || echo '(no table — the run did not finish)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the baseline CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artfid-baseline-${{ github.sha }}
          path: digitizer/artfid-baseline.csv
          if-no-files-found: warn

  # REPORT-ONLY, push-to-main-only. Times Auto Digitize per tracked fixture
  # (digitizer/tools/bench_digitize.py) and uploads JSON + markdown. Same
  # posture as art-fidelity-baseline: never on a PR, never required, and
  # continue-on-error so it cannot turn a green main red. Timings are only
  # comparable between runs on this same runner class.
  bench-digitize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        working-directory: digitizer
        run: pip install -r requirements.txt
      - name: Time Auto Digitize per fixture
        working-directory: digitizer
        run: python -m tools.bench_digitize --json bench-digitize.json --md bench-digitize.md
      - name: Publish the table to the run summary
        if: always()
        working-directory: digitizer
        run: |
          {
            echo '## Auto Digitize timing (report-only)'
            echo
            cat bench-digitize.md || echo '(no table — the run did not finish)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-digitize-${{ github.sha }}
          path: |
            digitizer/bench-digitize.json
            digitizer/bench-digitize.md
          if-no-files-found: warn
