# TEMPORARY — re-capture the flat-lane goldens on the machine whose CI judges
# them, for the `subpixel_edges` flip (plan 2026-09-08-subpixel-edges.md §7
# row 4, Kent's approval 2026-09-09). Removed with the same commit that lands
# the goldens, the way `claude/recapture-enthusiast-golden` was on 2026-08-17.
#
# The doctrine it enforces is `tools/recapture_flat_lane_key.py`'s: a key is
# written only after THIS machine reproduces it byte-for-byte on the
# PRE-CHANGE engine (`pre_ref`, the tree with the flag off by default), so
# what moves is the engine and not the runner. A key that fails that check is
# left alone and reported — it stays exactly as deselected as it was.
#
# `test_pushcomp.GOLDEN_FLAG_OFF` pins inline tuples rather than a JSON file;
# this job prints each tuple under the pre-change tree and under this tree so
# the re-pin can be made by hand with the same proof, per that file's notes.
name: recapture-goldens (temporary)

on:
  workflow_dispatch:
    inputs:
      pre_ref:
        description: the pre-change engine (default off) — a commit or ref
        required: true
        default: origin/main

permissions:
  contents: write

jobs:
  recapture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        working-directory: digitizer
        run: pip install -r requirements.txt
      - name: Pre-change tree
        run: |
          git worktree add ../pre "${{ github.event.inputs.pre_ref }}"
          echo "pre-change tree at $(git -C ../pre rev-parse HEAD)"
      - name: Re-capture the flat-lane keys that this engine moves
        working-directory: digitizer
        run: |
          mkdir -p ../recapture-evidence
          for key in "logo_whitebg.png" "logo_alpha.png" "ribbon_curve.png" "photo/enthusiast_logo.png"; do
            echo "=== $key"
            python tools/recapture_flat_lane_key.py "$key" --pre-change-tree ../../pre/digitizer 2>&1 | tee -a ../recapture-evidence/flat_lane_recapture.log || echo "refused or failed: $key" | tee -a ../recapture-evidence/flat_lane_recapture.log
          done
      - name: Pushcomp tuples, pre-change and this tree
        run: |
          python ../pre/digitizer/tools/pushcomp_pins.py pre-change 2>&1 | tee recapture-evidence/pushcomp_tuples.log || echo "pre-change tree has no pushcomp_pins.py; see the test file's notes" | tee -a recapture-evidence/pushcomp_tuples.log
          python digitizer/tools/pushcomp_pins.py this-tree 2>&1 | tee -a recapture-evidence/pushcomp_tuples.log
      - name: Commit the re-captured goldens back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- digitizer/testdata/flat_lane_golden.json; then
            echo "no golden moved on this machine"
          else
            git add digitizer/testdata/flat_lane_golden.json
            git commit -m "Re-capture the flat-lane goldens on ubuntu-latest for the subpixel_edges flip" -m "Written by the temporary recapture-goldens workflow: each key was first reproduced byte-for-byte on the pre-change engine (${{ github.event.inputs.pre_ref }}) on this runner, so what moved is the engine. Evidence: this run's recapture-evidence artifact."
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: recapture-evidence
          path: recapture-evidence/
