# TEMPORARY — re-capture the photo-lane stage-2 golden on the machine whose
# CI judges it, for the `robust_region_colour` flip (plan
# 2026-09-10-region-colour.md §6, Kent's ruling 2026-09-10). Removed with the
# commit after the one that lands the golden, the way the `subpixel_edges`
# flip's copy of this file was on 2026-09-09.
#
# The doctrine it enforces is `tools/recapture_photo_lane_key.py`'s: a key is
# written only after THIS machine reproduces it byte-for-byte on the
# PRE-CHANGE engine (`pre_ref`, the tree with the flag off by default), so
# what moves is the engine and not the runner. A key that fails that check is
# left alone and reported.
name: recapture-goldens (temporary)

on:
  workflow_dispatch:
    inputs:
      pre_ref:
        description: the pre-change engine (default off) — a commit or ref
        required: true
        default: origin/main
  # A workflow that lives only on a feature branch is not registered until
  # something runs it, and until it is registered `workflow_dispatch` is a
  # 404 (measured 2026-09-09). So the push that brings this file runs it
  # once; later pushes that leave the file alone do not.
  push:
    branches: [claude/emb-bot-quality-review-acwj61]
    paths: ['.github/workflows/recapture-goldens.yml']

permissions:
  contents: write

jobs:
  recapture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        working-directory: digitizer
        run: pip install -r requirements.txt
      - name: Pre-change tree
        run: |
          git worktree add ../pre "${{ github.event.inputs.pre_ref || 'origin/main' }}"
          echo "pre-change tree at $(git -C ../pre rev-parse HEAD)"
      - name: Re-capture the photo-lane keys that this engine moves
        working-directory: digitizer
        run: |
          mkdir -p ../recapture-evidence
          for key in "photo/drone_render.png" "photo/summit_badge.png" "photo/region_blobs.png" "photo/fur_ramp.png" "photo/repro_gradient_white_icon.png" "photo/photo_subject_stub.png" "photo/region_blobs.png#bgmask"; do
            echo "=== $key" | tee -a ../recapture-evidence/photo_lane_recapture.log
            python tools/recapture_photo_lane_key.py "$key" --pre-change-tree ../../pre/digitizer 2>&1 | tee -a ../recapture-evidence/photo_lane_recapture.log || echo "refused or failed: $key" | tee -a ../recapture-evidence/photo_lane_recapture.log
          done
      # The flat lane must NOT move under this flip (every flat-lane fixture
      # was byte-identical on the flip sheet); this runner says so on the
      # record, with CI's platform red deselected as CI does. Logged, never
      # fatal: a surprise here is information for the PR, and the golden
      # above was captured with its own proof either way.
      - name: Prove the goldens on this runner, this tree
        working-directory: digitizer
        continue-on-error: true
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_photo_lane_byte_identical.py tests/test_flat_lane_byte_identical.py
          --deselect "tests/test_flat_lane_byte_identical.py::test_flat_lane_is_byte_identical_to_the_pre_change_golden[photo/enthusiast_logo.png]"
          2>&1 | tee ../recapture-evidence/goldens_after.log
      - name: Commit the re-captured golden back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- digitizer/testdata/photo_lane_segment_golden.json; then
            echo "no golden moved on this machine"
          else
            git add digitizer/testdata/photo_lane_segment_golden.json
            git commit -m "Re-capture the photo-lane stage-2 golden on ubuntu-latest for the robust_region_colour flip" -m "Written by the temporary recapture-goldens workflow: each key was first reproduced byte-for-byte on the pre-change engine (${{ github.event.inputs.pre_ref || 'origin/main' }}) on this runner, so what moved is the engine. Evidence: this run's recapture-evidence artifact."
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recapture-evidence
          path: recapture-evidence/
