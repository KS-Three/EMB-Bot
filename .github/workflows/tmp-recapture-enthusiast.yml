# TEMPORARY — re-captures the `photo/enthusiast_logo.png` golden on the exact
# platform the digitizer CI job runs on (ubuntu-latest, python 3.12, pinned
# requirements.txt). Exists because goldens must NEVER be captured on Windows
# (ROADMAP standing item; .claude/memory/windows-goldens-fail-locally.md) and
# this machine has no WSL or Docker — the runner IS the environment whose CI
# has to go green, which is what tools/recapture_flat_lane_key.py's own
# docstring tells you to use.
#
# Deleted in the same PR that commits the artifact. Mirrors the digitizer
# job's environment steps exactly; does not touch python-package-conda.yml.
name: tmp-recapture-enthusiast

on:
  push:
    branches: [claude/recapture-enthusiast-golden]

jobs:
  recapture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: digitizer/requirements.txt
      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        working-directory: digitizer
        run: pip install -r requirements.txt
      - name: Worktrees — PRE (main before the PR 157 merge) and SATIN (promotion-path tip)
        run: |
          git worktree add /tmp/pre 0870c7623d80f39422aad8d891eb58418b956502
          git worktree add /tmp/satin 2729ea5f774103e250987e5596eca4803d53307c
      - name: Attribution evidence (PRE must equal golden; SATIN vs HEAD)
        working-directory: digitizer
        run: python tools/tmp_recapture_evidence.py
      - name: Re-capture, gated by the machine proof
        working-directory: digitizer
        run: python tools/recapture_flat_lane_key.py "photo/enthusiast_logo.png" --pre-change-tree /tmp/pre/digitizer
      - name: Prove the two red tests go green against the new golden
        working-directory: digitizer
        run: >
          python -m pytest -q
          "tests/test_flat_lane_byte_identical.py::test_flat_lane_is_byte_identical_to_the_pre_change_golden[photo/enthusiast_logo.png]"
          "tests/test_stage2_photo_segment.py::test_flat_and_gradient_lanes_still_match_golden_after_photo_dispatch[photo/enthusiast_logo.png]"
      - uses: actions/upload-artifact@v4
        with:
          name: recapture-evidence
          path: |
            digitizer/testdata/flat_lane_golden.json
            /tmp/renders
          if-no-files-found: error
