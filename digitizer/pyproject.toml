[project]
name = "digitizer-core"
version = "0.5.0"
description = "Fritsch's Stitches auto-digitizing engine: flat artwork -> embroidery stitch plan (stages 1-7, fill + satin) + localhost service"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # cv2 behavior (kmeans, contours) feeds golden tests — exact-pin and bump
    # deliberately (regenerate goldens on purpose, never by accident).
    # Contrib-headless (NOT plain opencv-python-headless) since 2026-08-04:
    # same cv2 at the same pin plus cv2.ximgproc, which stage1_photo_prep's
    # rolling_guidance texture kill needs. Golden-verified before the swap
    # (docs/photo-prep-deps-probe-2026-08-04.md). The two wheels both claim
    # the cv2 module — never co-install them.
    "opencv-contrib-python-headless==5.0.0.93",
    "numpy>=2.0",
    "scipy>=1.11",
    "shapely>=2.0",
    "scikit-image>=0.22",
    # Machine-file writer (MIT, pure Python). Build step 8 grows this into the
    # universal export adapter for every EMB-Bot design. pystitch is
    # pyembroidery's actively maintained Ink/Stitch fork — same API, same
    # Tajima bit convention; swap vetted symbol-by-symbol in
    # docs/pystitch-evaluation-2026-08-11.md before adopting (2026-08-11).
    "pystitch>=1.0.1",
    # `textcluster.py`'s OCR-confidence quality gate (2026-08-07): a thin
    # (Apache-2.0) wrapper around the system `tesseract-ocr` binary (a
    # SEPARATE, non-pip install — see README.md "Setup"; also Apache-2.0).
    # Only `pytesseract`'s own `packaging`/`Pillow` deps come along, both
    # already in this list transitively — no numpy/numba conflict like
    # `rembg_isolated/` had, so this stays in the shared venv unisolated
    # (confirmed via `pip show pytesseract` before adding it here).
    # `textcluster.py`'s OCR-suggested-text pass (2026-08-07, Studio "Convert
    # to text"): a thin (Apache-2.0) wrapper around the system `tesseract-ocr`
    # binary — a SEPARATE, non-pip install, see README.md "Setup" (also
    # Apache-2.0). Only `pytesseract`'s own `packaging`/`Pillow` deps come
    # along, both already in this list transitively.
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
# The localhost service (build step 8). Kept optional so digitizer-core stays
# usable — and sellable — as a plain library with no web stack attached.
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
# pytest-xdist: this suite is ~1,100 tests of real OpenCV/shapely work and ran
# ~19 minutes serially in CI, on every push. It parallelises cleanly (verified
# against a serial run: same pass/fail set), so `-n auto` is the default in CI
# and worth using locally too.
dev = ["pytest>=8", "pytest-xdist>=3.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["digitizer_core", "digitizer_service"]

[tool.setuptools.package-data]
# Generated thread charts (tools/gen_charts.py). They ship with the package so
# a brand preference resolves without reaching outside the install.
digitizer_core = ["chart_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
