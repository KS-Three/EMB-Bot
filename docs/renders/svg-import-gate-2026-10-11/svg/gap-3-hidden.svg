<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 20">
  <!-- one visible control, then five ways to hide an element -->
  <rect x="1" y="5" width="10" height="10" fill="#000000"/>
  <rect x="13" y="5" width="10" height="10" fill="#ff0000" display="none"/>
  <rect x="25" y="5" width="10" height="10" style="fill:#00a000;display:none"/>
  <rect x="37" y="5" width="10" height="10" fill="#0000ff" visibility="hidden"/>
  <rect x="49" y="5" width="10" height="10" fill="#ff8c00" opacity="0"/>
  <rect x="61" y="5" width="8" height="10" fill="#8a2be2" fill-opacity="0"/>
</svg>
